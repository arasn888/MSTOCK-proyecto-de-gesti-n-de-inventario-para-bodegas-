server:
  port: 9001

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://localhost:9888
  datasource:
    url: jdbc:mysql://localhost:3307/mstock_auth?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:mstock_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9761/eureka/

mstock:
  jwt:
    secret: ${JWT_SECRET}
    expiracion-minutos: 60