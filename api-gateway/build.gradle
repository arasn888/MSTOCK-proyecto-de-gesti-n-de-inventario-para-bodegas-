dependencies {
    // Gateway reactivo (Spring Cloud Gateway sobre WebFlux). No lleva spring-boot-starter-webmvc.
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    // Descubrimiento: las rutas usan lb://nombre-del-servicio
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // Resilience4J integrado al gateway (filtro CircuitBreaker con fallback)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    // Seguridad: valida el JWT que emite el auth-service
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
}
