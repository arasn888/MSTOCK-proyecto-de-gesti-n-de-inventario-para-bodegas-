server:
  port: 9004

spring:
  application:
    name: ventas-service
  config:
    import: optional:configserver:http://localhost:9888
  datasource:
    url: jdbc:mysql://localhost:3307/mstock_ventas?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:mstock_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5673
    username: ${RABBITMQ_USER:mstock}
    password: ${RABBITMQ_PASSWORD:}
    # Si RabbitMQ está caído, publicar un evento no debe dejar colgada la operación del usuario.
    connection-timeout: 2s
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 4000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9761/eureka/

mstock:
  jwt:
    secret: ${JWT_SECRET}
  # Para saltarse Eureka y llamar directo a los otros servicios, descomenta:
  # catalogo:
  #   url: http://localhost:9002
  # inventario:
  #   url: http://localhost:9003
