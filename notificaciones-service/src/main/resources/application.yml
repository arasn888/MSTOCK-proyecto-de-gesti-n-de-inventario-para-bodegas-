server:
  port: 9006

spring:
  application:
    name: notificaciones-service
  config:
    import: optional:configserver:http://localhost:9888
  datasource:
    url: jdbc:mysql://localhost:3307/mstock_notificaciones?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:mstock_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5673
    username: ${RABBITMQ_USER:mstock}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # Un mensaje que falla se reintenta 3 veces y, si sigue fallando,
        # va a la cola de mensajes muertos (notificaciones.dlq) en vez de perderse.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

mstock:
  jwt:
    secret: ${JWT_SECRET}
