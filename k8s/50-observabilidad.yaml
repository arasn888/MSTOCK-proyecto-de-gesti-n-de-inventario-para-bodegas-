# Observabilidad: Prometheus (recoge metricas) y Grafana (las muestra).
# Sus archivos de configuracion los crea desplegar.ps1 desde la carpeta observabilidad/ (ConfigMaps
# "prometheus-config" y "grafana-config"). Los datos de Prometheus viven en memoria del pod: si se reinicia, empieza de cero.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mstock
---
# Prometheus necesita permiso para listar los pods del namespace y descubrir a quien consultar
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: mstock
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: mstock
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: mstock
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: mstock
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: mstock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      enableServiceLinks: false
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=24h
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 10
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 768Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: mstock
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: mstock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      enableServiceLinks: false
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: mstock-secretos, key: GRAFANA_PASSWORD } }
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: config
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: config
              mountPath: /var/lib/grafana/dashboards/mstock.json
              subPath: mstock.json
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: grafana-config
