server:
  port: 9003

spring:
  application:
    name: inventario-service
  config:
    import: optional:configserver:http://localhost:9888
  datasource:
    url: jdbc:mysql://localhost:3307/mstock_inventario?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:mstock_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5673
    username: ${RABBITMQ_USER:mstock}
    password: ${RABBITMQ_PASSWORD:}
    # Si RabbitMQ está caído, publicar un evento no debe dejar colgada la operación del usuario.
    connection-timeout: 2s
    listener:
      simple:
        # Una compra que falla se reintenta 3 veces y luego va a inventario.dlq (no se reintenta para siempre).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 4000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:9761/eureka/

mstock:
  jwt:
    secret: ${JWT_SECRET}
  # Para saltarse Eureka y llamar directo al catálogo, descomenta:
  # catalogo:
  #   url: http://localhost:9002
