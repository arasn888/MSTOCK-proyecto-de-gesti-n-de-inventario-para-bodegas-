# Infraestructura (siempre): MySQL y RabbitMQ.
#   docker compose up -d                     -> solo infraestructura (desarrollo con Gradle y ng serve)
#   docker compose --profile full up -d --build -> TODO el sistema en contenedores (ver docs/docker.md)
#   ... --profile full --profile observabilidad  -> ademas Prometheus (9090) y Grafana (3000), ver docs/observabilidad.md

# Plantilla común de los servicios de negocio
x-servicio: &servicio
  restart: unless-stopped
  profiles: ["full"]
  environment: &entorno
    TZ: America/Lima
    SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:9888
    EUREKA_DEFAULT_ZONE: http://eureka-server:9761/eureka/
    EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    JWT_SECRET: ${JWT_SECRET}
    DB_USER: ${MYSQL_USER}
    DB_PASSWORD: ${MYSQL_PASSWORD}
    RABBITMQ_USER: ${RABBITMQ_USER}
    RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_RABBITMQ_PORT: "5672"
  depends_on: &dependencias
    mysql: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    config-server: { condition: service_healthy }
    eureka-server: { condition: service_healthy }

services:
  mysql:
    image: mysql:8.4
    container_name: mstock-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Lima
    ports:
      - "3307:3306"
    volumes:
      - mstock-mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management
    container_name: mstock-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - mstock-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------- Plataforma ----------
  eureka-server:
    build: { context: ., args: { SERVICE: eureka-server, PORT: "9761" } }
    image: mstock/eureka-server
    container_name: mstock-eureka
    profiles: ["full"]
    restart: unless-stopped
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    ports: ["9761:9761"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  config-server:
    build: { context: ., args: { SERVICE: config-server, PORT: "9888" } }
    image: mstock/config-server
    container_name: mstock-config
    profiles: ["full"]
    restart: unless-stopped
    environment:
      EUREKA_DEFAULT_ZONE: http://eureka-server:9761/eureka/
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    ports: ["9888:9888"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------- Servicios de negocio ----------
  auth-service:
    <<: *servicio
    build: { context: ., args: { SERVICE: auth-service, PORT: "9001" } }
    image: mstock/auth-service
    container_name: mstock-auth
    environment:
      <<: *entorno
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mstock_auth?useSSL=false&allowPublicKeyRetrieval=true
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123*}
    ports: ["9001:9001"]
    healthcheck: &salud
      test: ["CMD", "curl", "-fsS", "http://localhost:9001/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  catalogo-service:
    <<: *servicio
    build: { context: ., args: { SERVICE: catalogo-service, PORT: "9002" } }
    image: mstock/catalogo-service
    container_name: mstock-catalogo
    environment:
      <<: *entorno
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mstock_catalogo?useSSL=false&allowPublicKeyRetrieval=true
    ports: ["9002:9002"]
    healthcheck:
      <<: *salud
      test: ["CMD", "curl", "-fsS", "http://localhost:9002/actuator/health"]

  inventario-service:
    <<: *servicio
    build: { context: ., args: { SERVICE: inventario-service, PORT: "9003" } }
    image: mstock/inventario-service
    container_name: mstock-inventario
    environment:
      <<: *entorno
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mstock_inventario?useSSL=false&allowPublicKeyRetrieval=true
    ports: ["9003:9003"]
    healthcheck:
      <<: *salud
      test: ["CMD", "curl", "-fsS", "http://localhost:9003/actuator/health"]

  ventas-service:
    <<: *servicio
    build: { context: ., args: { SERVICE: ventas-service, PORT: "9004" } }
    image: mstock/ventas-service
    container_name: mstock-ventas
    environment:
      <<: *entorno
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mstock_ventas?useSSL=false&allowPublicKeyRetrieval=true
    ports: ["9004:9004"]
    healthcheck:
      <<: *salud
      test: ["CMD", "curl", "-fsS", "http://localhost:9004/actuator/health"]

  compras-service:
    <<: *servicio
    build: { context: ., args: { SERVICE: compras-service, PORT: "9005" } }
    image: mstock/compras-service
    container_name: mstock-compras
    environment:
      <<: *entorno
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mstock_compras?useSSL=false&allowPublicKeyRetrieval=true
    ports: ["9005:9005"]
    healthcheck:
      <<: *salud
      test: ["CMD", "curl", "-fsS", "http://localhost:9005/actuator/health"]

  notificaciones-service:
    <<: *servicio
    build: { context: ., args: { SERVICE: notificaciones-service, PORT: "9006" } }
    image: mstock/notificaciones-service
    container_name: mstock-notificaciones
    environment:
      <<: *entorno
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mstock_notificaciones?useSSL=false&allowPublicKeyRetrieval=true
    ports: ["9006:9006"]
    healthcheck:
      <<: *salud
      test: ["CMD", "curl", "-fsS", "http://localhost:9006/actuator/health"]

  # ---------- Entrada al sistema ----------
  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway, PORT: "8080" } }
    image: mstock/api-gateway
    container_name: mstock-gateway
    profiles: ["full"]
    restart: unless-stopped
    environment:
      TZ: America/Lima
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:9888
      EUREKA_DEFAULT_ZONE: http://eureka-server:9761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    depends_on:
      config-server: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck:
      <<: *salud
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]

  web:
    build: { context: ./frontend/mstock-web }
    image: mstock/web
    container_name: mstock-web
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      api-gateway: { condition: service_started }
    # El navegador llama al gateway en http://localhost:8080 (ver src/environments/environment.ts)
    ports: ["4200:80"]

  # ---------- Observabilidad (perfil aparte: --profile observabilidad) ----------
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: mstock-prometheus
    profiles: ["observabilidad"]
    restart: unless-stopped
    volumes:
      - ./observabilidad/prometheus/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: mstock-grafana
    profiles: ["observabilidad"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - mstock-grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on:
      - prometheus

volumes:
  mstock-grafana-data:
  mstock-mysql-data:
  mstock-rabbitmq-data:

